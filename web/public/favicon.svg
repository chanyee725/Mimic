  <path d="M8.5 24 11 9.5 16 18 21 9.5 23.5 24" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8.5" cy="24" r="1.9" fill="#fff"/>
  <circle cx="23.5" cy="24" r="1.9" fill="#fff"/>
  <circle cx="16" cy="18" r="2.7" fill="#3b82f6" stroke="#171717" stroke-width="1"/>
</svg>
