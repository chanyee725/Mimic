[project]
name = "mimic-sim"
version = "0.1.0"
description = "Mimic Isaac Sim runner: opens environment scenes (and later runs evaluations) inside Isaac Sim"
requires-python = "==3.11.*"
dependencies = ["isaacsim[all,extscache]==5.1.0"]

[tool.uv]
package = false
# Isaac Sim wheels and their pinned deps live on NVIDIA's index
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
