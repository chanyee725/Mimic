[project]
name = "vla-backend"
version = "0.1.0"
description = "Station backend for the VLA Data Pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "grpcio>=1.84.0",
  "grpcio-tools>=1.84.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "black>=24"]

[tool.black]
line-length = 100
target-version = ["py312"]
# protoc output (see README: gRPC)
extend-exclude = "app/realtime/grpc_gen/robot_pb2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
