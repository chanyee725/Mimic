[project]
name = "mimic-backend"
version = "0.1.0"
description = "Mimic station backend: teleoperation capture, review, LeRobot datasets, training and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "grpcio>=1.84.0",
  "grpcio-tools>=1.84.0",
  "python-dotenv>=1.0",
  "mcap>=1.5.0",
  "pyarrow>=25.0.1",
  "numpy>=2.0",
  "av>=15",  # lerobot[dataset] needs av<16
  "foxglove-schemas-protobuf>=0.4.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "black>=24"]
# LeRobot drives real devices on the Rigs page (connection test, calibration); imported lazily,
# so `uv sync --no-group hardware` gives a station without device access
hardware = ["lerobot[feetech,dataset]>=0.6,<0.7"]

[tool.uv]
default-groups = ["dev", "hardware"]

[tool.black]
line-length = 100
target-version = ["py312"]
# protoc output (see README: gRPC)
extend-exclude = "app/rpc/gen/robot_pb2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
